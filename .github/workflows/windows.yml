name: Build Windows portable app
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the ZIP and update manifest as a GitHub Release
        type: boolean
        default: true
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test Windows installer and rollback
        shell: powershell
        run: ./scripts/test-installer.ps1
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version do not match' }
      - name: Validate manual release target
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git rev-parse --verify "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Create tag $tag before publishing" }
          git diff --quiet $tag -- src package.json package-lock.json scripts/release-manifest.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Application sources differ from the release tag' }
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/release-manifest.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ContactRegistry-Windows-x64
          path: |
            dist/*.zip
            dist/update.json
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release create $tag dist/*.zip dist/update.json --verify-tag --generate-notes --title "ContactRegistry $tag"
